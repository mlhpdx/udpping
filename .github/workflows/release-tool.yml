name: Release .NET Tool

on:
  release:
    types:
      - created

jobs:
  publish:
    name: Pack and publish global tool to NuGet.org
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # enable GitHub OIDC token issuance for trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Pack global tool
        run: >
          dotnet pack src/udpping.csproj
          -c Release
          -p:PackAsTool=true
          -p:Version=${{ github.ref_name }}
          -o ./tool-out

      - name: NuGet login (OIDC exchange for a short-lived API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push package to NuGet.org
        run: >
          dotnet nuget push "./tool-out/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
